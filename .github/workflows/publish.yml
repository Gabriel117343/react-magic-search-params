name: Publish to npm

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is missing. Add it in GitHub repository secrets."
            exit 1
          fi
          TOKEN=$(printf '%s' "$NPM_TOKEN" | tr -d '\r\n')
          CONFIG_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf "registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n//npmjs.org/:_authToken=%s\n" "$TOKEN" "$TOKEN" > "$CONFIG_PATH"
          npm whoami

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run build

      - name: Prepare npm README (temporary)
        run: |
          cp README.md .README_GITHUB.md
          cp README_NPM.md README.md

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Restore GitHub README
        if: always()
        run: |
          if [ -f .README_GITHUB.md ]; then
            mv .README_GITHUB.md README.md
          fi
